monorepo_root = true

[env]
_.source = "{{ config_root }}/mise-env/docker.sh"

[monorepo]
config_roots = [
  "pkg/*",
  "internal/*"
]

[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
"go:github.com/kazhuravlev/options-gen/cmd/options-gen" = "v0.58.0"

[tasks.all]
description = "Generate, tidy, build, test, and lint every module sequentially"
run = '''
MISE_JOBS=1 mise run //internal/...:all
MISE_JOBS=1 mise run //pkg/...:all
'''

[tasks.release]
description = "Release every Go module with the same semantic version"
run = "./mise-tasks/release"
