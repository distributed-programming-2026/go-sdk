syntax = "proto3";

package distributedevent;

option go_package = "github.com/distributed-programming-2026/go-sdk/pkg/event/internal/eventpb";

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

message Envelope {
  string event_id = 1;
  string event_type = 2;
  string producer = 3;
  google.protobuf.Timestamp occurred_at = 4;
  string correlation_id = 5;
  google.protobuf.Any payload = 6;
}
